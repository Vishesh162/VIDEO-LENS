services:
  - type: web
    name: video-lens
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: WHISPER_PROVIDER
        value: groq
      - key: RAG_BACKEND
        value: memory
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: SESSION_TTL_SECONDS
        value: "3600"
