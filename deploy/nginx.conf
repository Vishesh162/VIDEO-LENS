pid /tmp/video-lens-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/video-lens-client;
    proxy_temp_path /tmp/video-lens-proxy;
    fastcgi_temp_path /tmp/video-lens-fastcgi;
    uwsgi_temp_path /tmp/video-lens-uwsgi;
    scgi_temp_path /tmp/video-lens-scgi;
    sendfile on;
    server {
        listen __PORT__;
        server_name _;
        root /app/frontend/out;
        index index.html;
        client_max_body_size 151m;
        client_body_timeout 120s;
        client_body_buffer_size 64k;
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_read_timeout 240s;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_send_timeout 120s;
        }
        location / {
            try_files $uri $uri/ =404;
        }
        error_page 404 /404.html;
        location ~ /\. { deny all; }
    }
}
